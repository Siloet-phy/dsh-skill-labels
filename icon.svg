<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="技能中文标签 dsh-skill-labels">
  <title>dsh-skill-labels</title>
  <desc>鲸鱼娘抱着一枚「中」字：技能列表的每个技能都带上中文小标题。</desc>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B93FF"/>
      <stop offset="1" stop-color="#3A54E0"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#badge)"/>

  <!-- 鲸鱼娘 + 「中」 -->
  <g transform="translate(248,281) scale(1.06) translate(-256,-281)">
    <!-- 鲸鱼娘：两条尾鳍当耳朵 -->
    <ellipse cx="178" cy="170" rx="48" ry="25" transform="rotate(-32 178 170)" fill="#FFFFFF"/>
    <ellipse cx="314" cy="170" rx="48" ry="25" transform="rotate(32 314 170)" fill="#FFFFFF"/>

    <!-- 鲸鱼娘：尾巴 -->
    <ellipse cx="410" cy="258" rx="54" ry="27" transform="rotate(-30 410 258)" fill="#FFFFFF"/>
    <ellipse cx="410" cy="326" rx="54" ry="27" transform="rotate(30 410 326)" fill="#FFFFFF"/>

    <!-- 鲸鱼娘：身体（头） -->
    <path d="M 118 300 C 118 214 176 174 248 174 C 320 174 372 214 372 298 C 372 358 322 388 246 388 C 170 388 118 358 118 300 Z" fill="#FFFFFF"/>

    <!-- 「中」：口 -->
    <rect x="196" y="231" width="100" height="100" rx="12" ry="12" fill="none" stroke="#3A54E0" stroke-width="32"/>
    <!-- 「中」：竖 -->
    <rect x="230" y="195" width="32" height="180" rx="10" ry="10" fill="#3A54E0"/>
  </g>
</svg>
