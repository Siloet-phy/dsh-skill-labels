<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="技能中文标签 dsh-skill-labels">
  <title>dsh-skill-labels</title>
  <desc>蓝色圆角底板上是一个大而清晰的白色「中」字；底边一只白色鲸鱼娘探出头，头顶两侧竖着小尾鳍。</desc>
  <defs>
    <linearGradient id="badge" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#8FA8FF"/>
      <stop offset="0.52" stop-color="#5B78F2"/>
      <stop offset="1" stop-color="#334FD2"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#badge)"/>

  <!-- 鲸鱼娘：头顶两侧竖起的尾鳍 -->
  <ellipse cx="184" cy="424" rx="31" ry="13" transform="rotate(-54 184 424)" fill="#FFFFFF"/>
  <ellipse cx="328" cy="424" rx="31" ry="13" transform="rotate(54 328 424)" fill="#FFFFFF"/>

  <!-- 鲸鱼娘：底边探出的圆脑袋 -->
  <path d="M 158 500 C 158 446 200 420 256 420 C 312 420 354 446 354 500 Z" fill="#FFFFFF"/>

  <!-- 眼睛 -->
  <ellipse cx="216" cy="462" rx="13" ry="15" fill="#1B2A6B"/>
  <ellipse cx="296" cy="462" rx="13" ry="15" fill="#1B2A6B"/>
  <circle cx="212" cy="457" r="5" fill="#FFFFFF"/>
  <circle cx="292" cy="457" r="5" fill="#FFFFFF"/>

  <!-- 腮红 -->
  <ellipse cx="183" cy="480" rx="16" ry="8.5" fill="#FFA6C9" opacity="0.92"/>
  <ellipse cx="329" cy="480" rx="16" ry="8.5" fill="#FFA6C9" opacity="0.92"/>

  <!-- 微笑 -->
  <path d="M 245 484 Q 256 492 267 484" fill="none" stroke="#1B2A6B" stroke-width="6" stroke-linecap="round"/>

  <!-- 「中」：竖（上下出头，占画面高度约 64%） -->
  <rect x="232" y="64" width="48" height="330" rx="14" ry="14" fill="#FFFFFF"/>
  <!-- 「中」：口 -->
  <rect x="196" y="170" width="120" height="120" rx="14" ry="14" fill="none" stroke="#FFFFFF" stroke-width="48"/>
</svg>
