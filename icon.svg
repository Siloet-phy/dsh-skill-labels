<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="技能中文标签 dsh-skill-labels">
  <title>dsh-skill-labels</title>
  <desc>蓝色圆角底板上是一个大而清晰的白色「中」字；底边一只白色鲸鱼娘探出头，大眼睛带双高光，左上方冒着水花。</desc>
  <defs>
    <linearGradient id="badge" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#8FA8FF"/>
      <stop offset="0.52" stop-color="#5B78F2"/>
      <stop offset="1" stop-color="#334FD2"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#badge)"/>

  <!-- 喷出的水花 -->
  <circle cx="202" cy="386" r="10" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="180" cy="360" r="8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="163" cy="334" r="6" fill="#FFFFFF" opacity="0.85"/>

  <!-- 鲸鱼娘：底边探出的圆脑袋 -->
  <path d="M 138 500 C 138 434 188 412 256 412 C 324 412 374 434 374 500 Z" fill="#FFFFFF"/>

  <!-- 大眼睛：深蓝眼珠 + 双高光 -->
  <ellipse cx="208" cy="460" rx="17" ry="19" fill="#1B2A6B"/>
  <ellipse cx="304" cy="460" rx="17" ry="19" fill="#1B2A6B"/>
  <circle cx="201" cy="452" r="7.5" fill="#FFFFFF"/>
  <circle cx="297" cy="452" r="7.5" fill="#FFFFFF"/>
  <circle cx="215" cy="468" r="3.6" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="311" cy="468" r="3.6" fill="#FFFFFF" opacity="0.9"/>

  <!-- 腮红 -->
  <ellipse cx="170" cy="484" rx="19" ry="9.5" fill="#FFA6C9" opacity="0.92"/>
  <ellipse cx="342" cy="484" rx="19" ry="9.5" fill="#FFA6C9" opacity="0.92"/>

  <!-- 猫咪嘴 -->
  <path d="M 242 486 Q 249 496 256 487 Q 263 496 270 486" fill="none" stroke="#1B2A6B" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 「中」：竖（上下各出头约 1/4 字高） -->
  <rect x="230" y="56" width="52" height="304" rx="12" ry="12" fill="#FFFFFF"/>
  <!-- 「中」：口（宽 264 × 高 168，宽高比 1.57:1） -->
  <rect x="147" y="156" width="218" height="122" rx="18" ry="18" fill="none" stroke="#FFFFFF" stroke-width="46"/>
</svg>
